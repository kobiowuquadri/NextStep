# Local development: PostgreSQL (and optionally the API in a container).
#   docker compose up -d db            # database only (run the API with pnpm dev:api)
#   docker compose --profile api up -d # database + API container
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nextstep
      POSTGRES_PASSWORD: nextstep
      POSTGRES_DB: nextstep
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextstep -d nextstep"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://nextstep:nextstep@db:5432/nextstep
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (openssl rand -base64 48)}
      CORS_ORIGINS: http://localhost:3000
      APP_PUBLIC_URL: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
